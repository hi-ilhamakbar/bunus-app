name: Build for deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No package-lock.json yet, so npm ci is not possible. The lock file is uploaded below: commit it.
      - run: npm install
      - run: npm run prisma:generate
        env:
          DATABASE_URL: mysql://ci:ci@localhost:3306/ci
      - run: npm run build
      - run: node scripts/make-api-bundle.mjs

      - name: Zip the build
        run: |
          (cd apps/web/dist && zip -qr ../../../bunus-web.zip .)
          (cd release/bunus-api && zip -qr ../../bunus-api.zip .)

      # One rolling release with the newest build: the easiest place to download it.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --cleanup-tag -y || true
          gh release create latest-build bunus-web.zip bunus-api.zip \
            --prerelease --title "Latest build" \
            --notes "Built from ${GITHUB_SHA}. bunus-web.zip goes in public_html, bunus-api.zip is the API app. See docs/deploy-shared-hosting.md."

      # Save the lock file into the repo the first time, so installs are repeatable.
      - name: Commit package-lock.json
        run: |
          if [ -z "$(git ls-files package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Add package-lock.json from first successful build"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
